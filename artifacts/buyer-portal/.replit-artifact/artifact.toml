kind = "web"
previewPath = "/buyer-portal/"
title = "Ticarium365 Buyer Portal"
version = "1.0.0"
id = "artifacts/buyer-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/buyer-portal/" ]
localPort = 23063

[services.development]
run = "pnpm --filter @workspace/buyer-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/buyer-portal", "run", "build" ]
publicDir = "artifacts/buyer-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23063"
BASE_PATH = "/buyer-portal/"
