kind = "mobile"
previewPath = "/smsystems-mobile/"
title = "Ticarium365 Mobil"
version = "1.0.0"
id = "artifacts/smsystems-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/smsystems-mobile/" ]
localPort = 21079

[services.development]
run = "pnpm --filter @workspace/smsystems-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smsystems-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/smsystems-mobile", "run", "serve" ]

[services.env]
PORT = "21079"
BASE_PATH = "/smsystems-mobile/"
